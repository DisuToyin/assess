services:
  - type: web
    name: assess-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build -w server
    startCommand: npm run db:migrate -w server && npm start -w server
    healthCheckPath: /api/health
    disk:
      name: assessment-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/assessment.db
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_REGISTRATION_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
